<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Join</title>

    <meta
      name="description"
      content="Join: Manage tasks, contacts and projects clearly in a Kanban board."
    />

    <meta
      name="keywords"
      content="Join, Kanban, task management, board, contacts"
    />

    <meta name="author" content="Ralph Koch" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="YOUR-URL/index.html" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/icons/joinFavicon.svg"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Join" />

    <meta
      property="og:description"
      content="Join: Manage tasks, contacts and projects clearly in a Kanban board."
    />

    <meta property="og:url" content="YOUR-URL/index.html" />

    <meta property="og:image" content="YOUR-URL/assets/icons/YOUR-IMAGE.png" />

    <meta property="og:site_name" content="Join" />

    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body class="signup-page">
    <header class="signup-header">
      <a href="../index.html" class="logo" aria-label="JOIN - Home">
        <img src="../assets/icons/join-logo.svg" alt="JOIN Logo" />
      </a>
    </header>

    <main class="signup-main">
      <section class="signup-card">
        <div class="signup-title-row">
          <a href="./login.html" class="back-link" aria-label="Back to login">
            <span aria-hidden="true">←</span>
          </a>
          <h1>Sign up</h1>
        </div>
        <img
          class="title-underline"
          src="../assets/icons/underline-signup.svg"
          alt=""
        />

        <form id="signup-form" class="signup-form">
          <div class="signup-input">
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Name"
              autocomplete="name"
              required
            />
            <img class="input-icon" src="../assets/icons/person.svg" alt="" />
          </div>

          <div class="signup-input">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              autocomplete="email"
              required
            />
            <img
              class="input-icon"
              src="../assets/icons/mail-signup.svg"
              alt=""
            />
          </div>

          <div class="signup-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              autocomplete="new-password"
              required
            />
            <img
              class="input-icon"
              src="../assets/icons/lock-signup.svg"
              alt=""
            />
          </div>

          <div class="signup-input">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm Password"
              autocomplete="new-password"
              required
            />
            <img
              class="input-icon"
              src="../assets/icons/lock-signup.svg"
              alt=""
            />
          </div>

          <label class="privacy-checkbox">
            <input type="checkbox" id="privacy" required />
            <span>
              I accept the
              <a href="./privacy.html">Privacy policy</a>
            </span>
          </label>

          <button type="submit" id="signup-button" disabled>Sign up</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./legal.html">Legal notice</a>
    </footer>

    <script src="../js/signup.js"></script>
  </body>
</html>
