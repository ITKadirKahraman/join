<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <!-- LINK -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/standard.css">
    <link rel="stylesheet" href="../css/help.css">
    <link rel="stylesheet" href="../css/menuBoard.css">
    <link rel="stylesheet" href="../css/menuBoardMobile.css">
    <link rel="stylesheet" href="../css/topHeader.css">
    <link rel="stylesheet" href="../css/topHeaderMobile.css">
    <link rel="stylesheet" href="../css/legal.css">
    <link rel="stylesheet" href="../css/legalMobile.css">
    <link rel="stylesheet" href="style.css">
   
    <link rel="shortcut icon" href="../assets/icons/joinFavicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/contacts.css">
    <link rel="stylesheet" href="../css/contactsOverlay.css">
    <link rel="stylesheet" href="../css/contactsMobile.css">
    
    <script src="../js/firebaseConfig.js" defer></script>
    <script src="../js/contactsDb.js" defer></script>
    <script src="../js/contactsApi.js" defer></script>
    <script src="../js/templates.js" defer></script>
    <script src="../js/contactsOverlay.js" defer></script>
    <script src="../js/contactsForm.js" defer></script>
    <script src="../js/contactsDelete.js" defer></script>
    <script src="../js/contacts.js" defer></script>

    
</head>
<body>
    <!-- MENU BOARD -->
        <header id="topHeader" class="topHeader">
            <div id="topHeader-content" class="header">
                <p class="title" id="title">Kanban Project Management Tool</p>
                <div class="circle">
                    <button id="helpButton" class="helpButton">
                        <a href="help.html">
                            <img class="questionCircle" src="../assets/icons/questionsCircle.svg" alt="Questions Circle Icon" id="questionCircle">
                        </a>
                    </button>
                    <button id="profileButton" class="profileButton">
                        <div id="nameKuerzel" class="nameKuerzel">G</div>
                    </button>
                </div>
            </div>
        </header>
        <header id="topHeaderResponsive" class="topHeaderResponsive">
            <img class="logo" src="../assets/icons/logoResponsive.svg" alt="Join Logo">
            <div id="topHeader-content" class="header">
                <div class="circle">
                    <button id="helpButton" class="helpButton">
                        <a href="help.html">
                            <img class="questionCircle" src="../assets/icons/questionsCircle.svg" alt="Questions Circle Icon" id="questionCircle">
                        </a>
                    </button>
                    <button id="profileButton" class="profileButton">
                        <div id="nameKuerzel" class="nameKuerzel">G</div>
                    </button>
                </div>
            </div>
        </header>
        <section class="menuBoard" id="menuBoard">
            <img class="logo" src="../assets/icons/joinDesktop.svg" alt="Join Logo">
            <nav class="menuContainer" id="menuContainer">
                <a class="menuItems" href="../html/summary.html"> <img src="../assets/icons/summary.svg" alt="Summary Icon"><p>Summary</p></a>
                <a class="menuItems" href="../html/addTask.html"> <img src="../assets/icons/addTask.svg" alt="Add Task Icon"><p>Add Task</p></a>
                <a class="menuItems" href="../html/board.html"> <img src="../assets/icons/board.svg" alt="Board Icon"><p>Board</p></a>
                <a class="menuItems" href="../html/contacts.html"> <img src="../assets/icons/contacts.svg" alt="Contacts Icon"><p>Contacts</p></a>
            </nav>
            <div class="menuContainer" id="policyContainer">
                <a class="menuItems" href="../html/privacy.html"> <p>Privacy Policy</p></a>
                <a class="menuItems" href="../html/legal.html"> <p>Legal notice</p></a>
            </div>
        </section>
        <section class="menuBoardResponsive" id="menuBoardResponsive">
            <nav class="menuContainer" id="menuContainer">
                <a class="menuItems" href="../html/summary.html"> <img src="../assets/icons/summary.svg" alt="Summary Icon">Summary</a>
                <a class="menuItems" href="../html/addTask.html"> <img src="../assets/icons/addTask.svg" alt="Add Task Icon">Add Task</a>
                <a class="menuItems" href="../html/board.html"> <img src="../assets/icons/board.svg" alt="Board Icon">Board</a>
                <a class="menuItems" href="../html/contacts.html"> <img src="../assets/icons/contacts.svg" alt="Contacts Icon">Contacts</a>
            </nav>
        </section>
        <main class="contacts">
            <section class="contacts__sidebar" aria-label="Contact list">
                <button type="button" class="contacts__add-button" id="addContactButton" data-action="open-add-contact">
                    <span class="contacts__add-label">Add new contact</span>
                    <img class="contacts__add-icon" src="../assets/icons/personAdd.svg" alt="">
                </button>
                <div id="contactList" class="contacts__list"></div>
            </section>
            <section class="contacts__detail" aria-labelledby="contactsTitle">
                <div class="contacts__heading">
                    <button type="button" class="contacts__back" data-action="close-detail" aria-label="Back to contact list">
                        <img src="../assets/icons/arrowLeft.svg" alt="">
                    </button>
                    <h1 id="contactsTitle" class="contacts__title">Contacts</h1>
                    <span class="contacts__divider" aria-hidden="true"></span>
                    <p class="contacts__slogan">Better with a team</p>
                </div>
                <div id="contactDetail"></div>
            </section>
    </main>
</body>
</html>
