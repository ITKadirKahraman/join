    <link rel="stylesheet" href="../css/topHeaderMobile.css">
    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/addTask.css">
    <link rel="stylesheet" href="../css/addTaskLists.css">
    <link rel="stylesheet" href="../css/addTaskMobile.css">

    <script src="../script.js"></script>

    <script src="../js/contactsApi.js" defer></script>
    <script src="../js/templates.js" defer></script>
    <script src="../js/tasksDb.js" defer></script>
    <script src="../js/tasksApi.js" defer></script>
    <script src="../js/tasksTemplates.js" defer></script>
    <script src="../js/addTask.js" defer></script>


    
</head>
<body>
    <!-- MENU BOARD -->
        <header id="topHeader" class="topHeader">
            <div class="header">
                <p class="title" id="title">Kanban Project Management Tool</p>
                <div class="circle">
                    <a href="help.html" class="helpButton" aria-label="Help">
                        <img class="questionCircle" src="../assets/icons/questionsCircle.svg" alt="">
                    </a>
                    <button type="button" class="profileButton" aria-haspopup="true" aria-expanded="false" aria-label="Profile menu">
                        <div class="nameKuerzel">G</div>
                    </button>
                    <nav class="profileMenu" aria-label="Profile menu" hidden>
                        <a class="profileMenuItem" href="legal.html">Legal Notice</a>
                        <a class="profileMenuItem" href="privacy.html">Privacy Policy</a>
                        <button type="button" class="profileMenuItem logoutButton">Log out</button>
                    </nav>
                </div>
            </div>
        </header>
        <header id="topHeaderResponsive" class="topHeaderResponsive">
            <img class="logo" src="../assets/icons/logoResponsive.svg" alt="Join Logo">
            <div class="header">
                <div class="circle">
                    <a href="help.html" class="helpButton" aria-label="Help">
                        <img class="questionCircle" src="../assets/icons/questionsCircle.svg" alt="">
                    </a>
                    <button type="button" class="profileButton" aria-haspopup="true" aria-expanded="false" aria-label="Profile menu">
                        <div class="nameKuerzel">G</div>
                    </button>
                    <nav class="profileMenu" aria-label="Profile menu" hidden>
                        <a class="profileMenuItem" href="legal.html">Legal Notice</a>
                        <a class="profileMenuItem" href="privacy.html">Privacy Policy</a>
                        <button type="button" class="profileMenuItem logoutButton">Log out</button>
                    </nav>
                </div>
            </div>
        </header>
        <section class="menuBoard" id="menuBoard">
            <img class="logo" src="../assets/icons/joinDesktop.svg" alt="Join Logo">
            <nav class="menuContainer">
                <a class="menuItems" href="../html/summary.html"> <img src="../assets/icons/summary.svg" alt="Summary Icon"><p>Summary</p></a>
                <a class="menuItems" href="../html/addTask.html"> <img src="../assets/icons/addTask.svg" alt="Add Task Icon"><p>Add Task</p></a>
                <a class="menuItems" href="../html/board.html"> <img src="../assets/icons/board.svg" alt="Board Icon"><p>Board</p></a>
                <a class="menuItems" href="../html/contacts.html"> <img src="../assets/icons/contacts.svg" alt="Contacts Icon"><p>Contacts</p></a>
                <a class="menuItems menuItems--login" href="../html/login.html" hidden><p>Log in</p></a>
            </nav>
            <div class="menuContainer" id="policyContainer">
                <a class="menuItems" href="../html/privacy.html"> <p>Privacy Policy</p></a>
                <a class="menuItems" href="../html/legal.html"> <p>Legal notice</p></a>
            </div>
        </section>
        <section class="menuBoardResponsive" id="menuBoardResponsive">
            <nav class="menuContainer">
                <a class="menuItems" href="../html/summary.html"> <img src="../assets/icons/summary.svg" alt="Summary Icon">Summary</a>
                <a class="menuItems" href="../html/addTask.html"> <img src="../assets/icons/addTask.svg" alt="Add Task Icon">Add Task</a>
                <a class="menuItems" href="../html/board.html"> <img src="../assets/icons/board.svg" alt="Board Icon">Board</a>
                <a class="menuItems" href="../html/contacts.html"> <img src="../assets/icons/contacts.svg" alt="Contacts Icon">Contacts</a>
                <a class="menuItems menuItems--login" href="../html/login.html" hidden>Log in</a>
            </nav>
        </section>
        <main class="addTask">
            <h1 class="addTask__title" id="pageTitle">Add Task</h1>
            <form class="addTask__form" id="addTaskForm" novalidate>
                <div class="addTask__columns">
                    <div class="addTask__column">
                        <div class="field">
                            <label class="field__label" for="taskTitle">Title<span class="field__required">*</span></label>
                            <input class="field__input" type="text" id="taskTitle" placeholder="Enter a title" autocomplete="off" aria-describedby="taskTitle-error">
                            <p class="field__error" id="taskTitle-error" aria-live="polite"></p>
                        </div>
                        <div class="field">
                            <label class="field__label" for="taskDescription">Description</label>
                            <textarea class="field__input field__input--area" id="taskDescription" placeholder="Enter a Description"></textarea>
                        </div>
                        <div class="field">
                            <label class="field__label" for="taskDueDate">Due date<span class="field__required">*</span></label>
                            <input class="field__input" type="date" id="taskDueDate" aria-describedby="taskDueDate-error">
                            <p class="field__error" id="taskDueDate-error" aria-live="polite"></p>
                        </div>
                    </div>
                    <div class="addTask__divider" aria-hidden="true"></div>
                    <div class="addTask__column">
                        <div class="field">
                            <span class="field__label" id="priorityLabel">Priority</span>
                            <div class="priority" role="group" aria-labelledby="priorityLabel">
                                <button type="button" class="priority__button" data-action="set-priority" data-priority="urgent" aria-pressed="false">Urgent <span class="priority__icon" aria-hidden="true">▲▲</span></button>
                                <button type="button" class="priority__button" data-action="set-priority" data-priority="medium" aria-pressed="true">Medium <span class="priority__icon" aria-hidden="true">=</span></button>
                                <button type="button" class="priority__button" data-action="set-priority" data-priority="low" aria-pressed="false">Low <span class="priority__icon" aria-hidden="true">▼▼</span></button>
                            </div>
                        </div>
                        <div class="field">
                            <span class="field__label" id="assignedLabel">Assigned to</span>
                            <div class="assign" id="assignedTo">
                                <button type="button" class="field__input assign__toggle" id="assignToggle" data-action="toggle-contact-menu" aria-haspopup="true" aria-expanded="false" aria-controls="contactOptions" aria-labelledby="assignedLabel assignToggle">Select contacts to assign</button>
                                <ul class="assign__options" id="contactOptions" hidden></ul>
                            </div>
                            <div class="assign__selected" id="selectedContacts"></div>
                        </div>
                        <div class="field">
                            <label class="field__label" for="taskCategory">Category<span class="field__required">*</span></label>
                            <select class="field__input field__input--select" id="taskCategory" aria-describedby="taskCategory-error">
                                <option value="">Select task category</option>
                                <option value="Technical Task">Technical Task</option>
                                <option value="User Story">User Story</option>
                            </select>
                            <p class="field__error" id="taskCategory-error" aria-live="polite"></p>
                        </div>
                        <div class="field">
                            <label class="field__label" for="subtaskInput">Subtasks</label>
                            <div class="subtaskInput">
                                <input class="field__input" type="text" id="subtaskInput" placeholder="Add new subtask" autocomplete="off">
                                <button type="button" class="subtaskInput__plus" data-action="focus-subtask" aria-label="Add subtask">+</button>
                                <span class="subtaskInput__actions">
                                    <button type="button" data-action="clear-subtask-input" aria-label="Empty the subtask field"><img src="../assets/icons/close.svg" alt=""></button>
                                    <button type="button" class="subtaskInput__confirm" data-action="add-subtask" aria-label="Add subtask"><img src="../assets/icons/check.svg" alt=""></button>
                                </span>
                            </div>
                            <ul class="subtaskList" id="subtaskList"></ul>
                        </div>
                    </div>
                </div>
                <div class="addTask__footer">
                    <p class="addTask__note"><span class="field__required">*</span>This field is required</p>
                    <p class="field__error" id="form-error" role="alert"></p>
                    <div class="addTask__buttons">
                        <button type="button" class="addTask__button addTask__button--secondary" id="clearButton">Clear <img src="../assets/icons/close.svg" alt=""></button>
                        <button type="submit" class="addTask__button addTask__button--primary" id="createButton"><span id="createLabel">Create Task</span> <img src="../assets/icons/check.svg" alt=""></button>
                    </div>
                </div>
            </form>
        </main>
</body>
</html>
