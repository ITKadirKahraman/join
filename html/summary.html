<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <!-- LINK -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/standard.css">
    <link rel="stylesheet" href="../css/help.css">
    <link rel="stylesheet" href="../css/menuBoard.css">
    <link rel="stylesheet" href="../css/menuBoardMobile.css">
    <link rel="stylesheet" href="../css/topHeader.css">
    <link rel="stylesheet" href="../css/topHeaderMobile.css">
    <link rel="stylesheet" href="../css/summary.css">
    <link rel="stylesheet" href="../css/summaryMobile.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <!-- JS -->
    <script src="../script.js"></script>
    <script src="../js/headerMenuSummary.js" defer></script>
    <script src="../js/firebaseConfig.js" defer></script>
    <script src="../js/tasksDb.js" defer></script>
    <script src="../js/tasksApi.js" defer></script>
    <script src="../js/summary.js" defer></script>
    
    <link rel="shortcut icon" href="../assets/icons/joinFavicon.svg" type="image/x-icon">
</head>
<body>
        <!-- MENU BOARD -->
        <header id="topHeaderSummary" class="topHeader"></header>
        <header id="topHeaderResponsiveSummary" class="topHeaderResponsive"></header>
        <section id="menuBoardSummary" class="menuBoard"></section>
        <section id="menuBoardResponsiveSummary" class="menuBoardResponsive"></section>
        <!-- Summary Page -->
        <section class="summary_page">
            <article class="summary_header_article">
                <h1 class="summary_header">Join 360</h1>
                <div class="summary_separator"></div>
                <p class="summary_text">Key Metrics at a Glance</p>
            </article>
            <article class="summary_header_article_mobile">
                <h1 class="summary_header">Join 360</h1>
                <p class="summary_text">Key Metrics at a Glance</p>
                <div class="summary_separator"></div>
            </article>
            <div class="summary_content">
                <div class="summary_btn_grid">
                    <div class="summary_btn_top_container">
                        <div class="summary_btn">
                            <div class="summary_icon penHover"><img src="../assets/icons/pen.svg" alt="Pen"></div>
                            <div class="summary_counter">
                                <div id="countTodo" class="summary_count">0</div>
                                <a class="summaryLink" href="../html/board.html">To-do</a>
                            </div>
                        </div>
                        <div class="summary_btn">
                            <div class="summary_icon arrowHover"><img src="../assets/icons/summaryArrowRight.svg" alt="Arrow for Right"></div>
                            <div class="summary_counter">
                                <div id="countDone" class="summary_count">0</div>
                                <a class="summaryLink" href="../html/board.html">Done</a>
                            </div>
                        </div>
                    </div>
                    <div class="summary_btn_middle_container">
                        <div class="summary_btn">
                            <div class="summary_urgent">
                                <img src="../assets/icons/summaryArrowTop.svg" alt="Arrow for Top">
                                <div class="summary_counter">
                                    <div id="countUrgent" class="summary_count">0</div>
                                    <a class="summaryLink" href="../html/board.html">Urgent</a>
                                </div>
                                <div class="summary_urgent_separator"></div>
                            </div>
                            <div class="summary_dealine_container">
                                <div id="deadline" class="summary_deadline">–</div>
                                <a class="summaryLink" href="../html/board.html">Upcoming Dealine</a>
                            </div>
                        </div>
                    </div>
                    <div class="summary_btn_bottom_container">
                        <div class="summary_btn">
                            <div class="summary_counter">
                                <div id="countBoard" class="summary_count">0</div>
                                <a class="summaryLink" href="../html/board.html">Task in Board</a>
                            </div>
                        </div>
                        <div class="summary_btn">
                            <div class="summary_counter">
                                <div id="countInProgress" class="summary_count">0</div>
                                <a class="summaryLink" href="../html/board.html">Task in Progress</a>
                            </div>
                        </div>
                        <div class="summary_btn">
                            <div class="summary_counter">
                                <div id="countAwaiting" class="summary_count">0</div>
                                <a class="summaryLink" href="../html/board.html">Awaiting Feedback</a>
                            </div>
                        </div>
                    </div>
                </div>
                <article class="summary_greeting">
                    <h3 class="summary_greeting_text">Good morning,</h3>
                    <h3 class="summary_greeting_person">Guest</h3>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
